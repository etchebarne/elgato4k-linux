[package]
name = "elgato4k-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Live preview, audio monitoring and settings for Elgato 4K X / 4K S capture cards on Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/etchebarne/elgato4k-linux"

[dependencies]
elgato4k-linux = { path = "..", default-features = false }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gst = { package = "gstreamer", version = "0.25" }
rusb = "0.9"
